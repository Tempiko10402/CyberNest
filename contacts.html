<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — TechKG</title><link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head><body>
    <div class="theme-switch"><input type="checkbox" id="theme-toggle"><label for="theme-toggle">СветТьма</label></div>
    
    <header><div class="container">
        <div class="logo">TechKG</div>
        <div class="nav-toggle" onclick="this.parentNode.parentNode.querySelector('nav').classList.toggle('open')"><span></span><span></span><span></span></div>
        <nav><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="cart.html">Корзина (0)</a><a href="contacts.html" class="active">Контакты</a></nav>
    </div></header>
    
    <div class="contacts-page container">
        <h2>Свяжитесь с нами</h2>
        <div class="contacts-grid">
            <div class="contact-card"><h3>Адрес</h3><p>Бишкек, ТЦ «Бишкек Парк», 2 этаж</p></div>
            <div class="contact-card"><h3>Телефон</h3><p>+996 999 123-456</p></div>
            <div class="contact-card"><h3>Время работы</h3><p>10:00–22:00 без выходных</p></div>
            <div class="contact-card"><h3>WhatsApp</h3><p>+996 999 123-456</p></div>
        </div>
        <div class="map"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2924.135!2d74.5905!3d42.8746!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x389eb7e5b7e5e5e5%3A0x8f8f8f8f8f8f8f8f!2sBishkek+Park!5e0!3m2!1sru!2skg!4v1731270000000" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe></div>
    </div>
    
    <footer><div class="container"><p>© 2025 TechKG</p></div></footer>
    <a href="#" class="to-top" id="toTop">Вверх</a>
    <script>
        const t = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme')==='dark') { document.body.setAttribute('data-theme','dark'); t.checked=true; }
        t.addEventListener('change',()=>{ if(t.checked){document.body.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');}
        else{document.body.removeAttribute('data-theme');localStorage.setItem('theme','light');}});
        window.addEventListener('scroll',()=>{document.getElementById('toTop').classList.toggle('show',window.scrollY>500);});
    </script>
    </body></html>
