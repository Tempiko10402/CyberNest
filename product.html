<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi 14 — TechKG</title><link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head><body>
    <div class="theme-switch"><input type="checkbox" id="theme-toggle"><label for="theme-toggle">СветТьма</label></div>
    
    <header><div class="container">
        <div class="logo">TechKG</div>
        <div class="nav-toggle" onclick="this.parentNode.parentNode.querySelector('nav').classList.toggle('open')"><span></span><span></span><span></span></div>
        <nav><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="cart.html">Корзина (0)</a><a href="contacts.html">Контакты</a></nav>
    </div></header>
    
    <div class="product-page container">
        <div class="product-gallery"><img src="https://via.placeholder.com/600x600.png?text=Xiaomi+14" alt="Xiaomi 14"></div>
        <div class="product-info">
            <h1>Смартфон Xiaomi 14 12/512 ГБ</h1><p class="product-code">Код: 478512</p>
            <div class="price-big">49 990 ₽</div><div class="old-price">59 990 ₽</div><p class="discount">-17%</p>
            <button class="btn-big">В корзину</button><button class="btn-big" style="background:#e67e22;">Купить в 1 клик</button>
            <div class="features"><h3>Характеристики</h3><ul><li>Экран 6.36″ AMOLED 120 Гц</li><li>Snapdragon 8 Gen 3</li><li>Камера Leica 50+50+50 МП</li></ul></div>
        </div>
    </div>
    
    <footer><div class="container"><p>© 2025 TechKG</p></div></footer>
    <a href="#" class="to-top" id="toTop">Вверх</a>
    <script>
        const t = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme')==='dark') { document.body.setAttribute('data-theme','dark'); t.checked=true; }
        t.addEventListener('change',()=>{ if(t.checked){document.body.setAttribute('data-theme','dark');localStorage.setItem('theme','dark');}
        else{document.body.removeAttribute('data-theme');localStorage.setItem('theme','light');}});
        window.addEventListener('scroll',()=>{document.getElementById('toTop').classList.toggle('show',window.scrollY>500);});
    </script>
    </body></html>
