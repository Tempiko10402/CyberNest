<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — TechKG</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">TechKG</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="catalog.html">Каталог</a>
                <a href="cart.html" class="active">Корзина (3)</a>
                <a href="contacts.html">Контакты</a>
            </nav>
        </div>
    </header>

    <div class="cart-page container">
        <h2>Ваша корзина</h2>
        <div class="cart-items">
            <div class="cart-item">
                <img src="https://via.placeholder.com/100x100.png?text=Xiaomi+14" alt="">
                <div class="info">
                    <h4>Смартфон Xiaomi 14</h4>
                    <p>Черный, 12/512 ГБ</p>
                </div>
                <div class="quantity">1 шт.</div>
                <div class="price">49 990 ₽</div>
            </div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/100x100.png?text=AirPods" alt="">
                <div class="info">
                    <h4>Наушники AirPods Pro 2</h4>
                </div>
                <div class="quantity">1 шт.</div>
                <div class="price">24 990 ₽</div>
            </div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/100x100.png?text=Чехол" alt="">
                <div class="info">
                    <h4>Чехол Spigen для iPhone</h4>
                </div>
                <div class="quantity">2 шт.</div>
                <div class="price">3 980 ₽</div>
            </div>
        </div>

        <div class="cart-summary">
            <div class="total">Итого: <strong>78 960 ₽</strong></div>
            <button class="btn-checkout">Оформить заказ</button>
            <a href="catalog.html" class="continue-shopping">Продолжить покупки</a>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2025 TechKG</p>
        </div>
    </footer>
</body>
</html>
